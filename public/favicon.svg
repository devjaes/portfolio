<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- terminal tile -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0a0e15"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#65c18f" stroke-opacity="0.34" stroke-width="1"/>
  <!-- JM monogram in mono, drawn as strokes for even weight -->
  <g stroke="#65c18f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- J -->
    <path d="M45 26v30a11 11 0 0 1-22 1"/>
    <!-- M -->
    <path d="M63 68V26l13 20 13-20v42"/>
  </g>
  <!-- ticker sparkline, lower band -->
  <path d="M22 100l13-8 10 6 12-13 10 5" fill="none" stroke="#75d5a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- breakout up-arrow ending the trend -->
  <path d="M80 92l22-16" fill="none" stroke="#75d5a0" stroke-width="6" stroke-linecap="round"/>
  <path d="M91 75h12v12" fill="none" stroke="#75d5a0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
